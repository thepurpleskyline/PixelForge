<!DOCTYPE html>
<html>
  <head>
    <Title>PixelForge</Title>
    <link rel="stylesheet" href="pixelforge.css">
  </head>

  <body>

    <nav class="navbar">
      <div class="logo">PixelForge</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Games</a>
        <a href="#">Leaderboard</a>
        <a href="javascript:void(0)" onclick="openLogin()">Login</a>
        <a href="javascript:void(0)" onclick="openRegister()">Create Account</a>
      </div>
    </nav>

    <h1>PixelForge</h1>
    <p>Play browser games instantly.</p>
    <div class="game-grid">

      <div class="game-card">
        <h3>Tetris</h3>
        <button>Play</button>
      </div>

      <div class="game-card">
        <h3>Snake</h3>
        <button>Play</button>
      </div>

      <div class="game-card">
        <h3>Pong</h3>
        <button>Play</button>
      </div>

      <div class="game-card">
        <h3>Minesweeper</h3>
        <button>Play</button>    
      </div>

      <div class="game-card">
        <h3>Pac-Man</h3>
        <button>Play</button>
      </div>

      <div class="game-card">
        <h3>Asteroids</h3>
        <button>Play</button>
      </div>

    </div>

    

    <div id="loginOverlay" class="overlay">
          <div class="login-card">
              <h2>Access terminal</h2>
              <form>
                  <div class="input-group">
                      <label>Username</label>
                      <input type="text" name="username" placeholder="Enter pilot name...">
                  </div>
                  <div class="input-group">
                      <label>Password</label>
                      <input type="password" name="password" placeholder="........">
                  </div>
                  <div class="button-group">
                    <button type="button" class="init-btn">Initialize Link</button>
                    <button type="button" onclick="closeLogin()" class="close-btn">Close</button>
                  </div>
              </form>
              <p>New pilot? <a href="javascript:void(0)" onclick="openRegister()">Create Account</a></p>
          </div>
      </div>

      <div id="registerOverlay" class="overlay">
        <div class="login-card">
          <h2>New Pilot Registration</h2>
          <form id="registerForm">
            <div class="input-group">
              <label>Username</label>
              <input type="text" name="username" placeholder="Choose your callsign...">
            </div>
            <div class="input-group">
              <label>Password</label>
              <input type="password" name="password" id="regPassword" placeholder="Minimum 8 characters">
            </div>
            <div class="input-group">
              <label>Confirm Password</label>
              <input type="password" id="confirmPassword" placeholder="Repeat password">
            </div>
            <div class="button-group">
              <button type="button" class="init-btn" onclick="validateRegistration()">Create Account</button>
              <button type="button" onclick="closeRegister()" class="close-btn">Close</button>
            </div>
          </form>
        </div>
      </div>

      <script src="script.js"></script>"
  </body>
</html>
