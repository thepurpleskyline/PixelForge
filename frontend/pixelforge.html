<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <Title>PixelForge</Title>
    <link rel="stylesheet" href="pixelforge.css">
  </head>

  <body>

    <nav class="navbar">
      <div class="logo">PixelForge</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Games</a>
        <a href="#">Leaderboard</a>
        <a id="navLogin" href="javascript:void(0)" onclick="openLogin()">Login</a>
        <a id="navRegister" href="javascript:void(0)" onclick="openRegister()">Create Account</a>
        <a id="navLogout" href="javascript:void(0)" onclick="logoutUser()" style="display: none;">Logout</a>
      </div>
    </nav>

    <h1>PixelForge</h1>
    <p>Play browser games instantly.</p>

    <!-- Status Message bar-->
     <p id="statusBanner" style="color: #00ffcc; text-align: center; font-weight: bold;"></p>

    <div class="game-grid">

      <div class="game-card">
        <h3>Tetris</h3>
        <button onclick="launchGame(1, '/games/tetris/index.html')">Play</button>
      </div>

      <div class="game-card">
        <h3>Snake</h3>
        <button onclick="launchGame(2, '/games/snake/index.html')">Play</button>
      </div>

      <div class="game-card">
        <h3>Pong</h3>
        <button onclick="launchGame(3, '/games/pong/index.html')">Play</button>
      </div>

      <div class="game-card">
        <h3>Minesweeper</h3>
        <button onclick="launchGame(4, '/games/minesweeper/index.html')">Play</button>    
      </div>

      <div class="game-card">
        <h3>Pac-Man</h3>
        <button onclick="launchGame(5, '/games/pacman/index.html')">Play</button>
      </div>

      <div class="game-card">
        <h3>Asteroids</h3>
        <button onclick="launchGame(6, '/games/asteroids/index.html')">Play</button>
      </div>

    </div>

    <!-- Login Modal -->

    <div id="loginOverlay" class="overlay">
          <div class="login-card">
              <h2>Access terminal</h2>
              <form>
                  <div class="input-group">
                      <label>Username</label>
                      <input type="text" name="username" placeholder="Enter pilot name..." required>
                  </div>
                  <div class="input-group">
                      <label>Password</label>
                      <input type="password" name="password" placeholder="........" required>
                  </div>
                  <div class="button-group">
                    <button type="button" class="init-btn" onclick="handlelogin()">Initialize Link</button>
                    <button type="button" onclick="closeLogin()" class="close-btn">Close</button>
                  </div>
              </form>
              <p>New pilot? <a href="javascript:void(0)" onclick="openRegister()">Create Account</a></p>
          </div>
      </div>

      <!-- Register Modal -->
      <div id="registerOverlay" class="overlay">
        <div class="login-card">
          <h2>New Pilot Registration</h2>
          <form id="registerForm">
            <div class="input-group">
              <label>Username</label>
              <input type="text" name="username" placeholder="Choose your callsign..." required>
            </div>
            <div class="input-group">
              <label>Password</label>
              <input type="password" name="password" id="regPassword" placeholder="Minimum 8 characters" required>
            </div>
            <div class="input-group">
              <label>Confirm Password</label>
              <input type="password" id="confirmPassword" placeholder="Repeat password" required>
            </div>
            <div class="button-group">
              <button type="button" class="init-btn" onclick="handleRegistration()">Create Account</button>
              <button type="button" onclick="closeRegister()" class="close-btn">Close</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Game Screen Overlay -->
       <div id="gameoverlay" class="overlay" style="display: none;">
        <div class="login-card" style="width: 850px; max-width: 90vw;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="activeGameTitle">Playing Game</h2>
            <button type="button" onclick="closeGame()" class="close-btn">Exit Game</button>
            </div>
            <div class="iframe-wrapper" style="margin-top: 15px;">
              <iframe id="gameFrame" src="" width="100%" height="500px" style="border: none; background: #000;"></iframe>
            </div>
          </div>
        </div>

      <script src="script.js"></script>"
  </body>
</html>
