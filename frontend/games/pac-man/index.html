<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PAC-MAN</title>
<style>
  .gm { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .gm h1 { margin:0; color:var(--foreground, #fff); letter-spacing:8px; font-size:22px; font-weight:800; }
  .gm canvas { background:#000; border:1px solid var(--border, #333); border-radius:10px;
               max-width:96vw; height:auto; touch-action:none; }
  .gm .hints { color:var(--muted-foreground, #888); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .gm kbd { color:var(--foreground, #ddd); border:1px solid var(--border, #444); border-radius:4px; padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<div class="gm">
  <h1>PAC-MAN</h1>
  <canvas id="game" width="560" height="640"></canvas>
  <div class="hints">
    <span><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> move</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> sound</span>
    <span>swipe to move (mobile)</span>
  </div>
</div>
<script>
'use strict';
// ============================================================
//  PAC-MAN — single-file, canvas, WebAudio. No assets.
// ============================================================

// ---------------- Maze (validated: 28x29, 246 pellets, all reachable) --
const MAZE = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"######.##          ##.######",
"######.## ###--### ##.######",
"######.## #      # ##.######",
"      .## #      # ##.      ",
"######.## #      # ##.######",
"######.## ######## ##.######",
"######.##          ##.######",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##.......  .......##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.########.##.########.#.#.#",
"#.########.##.########.#.#.#",
"#..........................#",
"############################",
];

const COLS = MAZE[0].length, ROWS = MAZE.length, CELL = 20;
const W = COLS * CELL, H = ROWS * CELL, OY = 60, CH = H + OY;   // 560 x 640
const WALL = MAZE.map(r => [...r].map(ch => (ch === '#' || ch === '-') ? 1 : 0));
const DOOR = MAZE.map(r => [...r].map(ch => ch === '-' ? 1 : 0));
const isTunnelRow = r => MAZE[r][0] === ' ' && MAZE[r][COLS - 1] === ' ';
const DIRS = [{ x: 0, y: -1 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }];

// Pre-baked wall outline segments (wall cell edge adjacent to a passage)
const SEGS = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  if (!WALL[r][c]) continue;
  const x = c * CELL, y = r * CELL;
  const open = (dr, dc) => {
    const nr = r + dr, nc = c + dc;
    return (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) ? !WALL[nr][nc] : false;
  };
  if (open(1, 0))  SEGS.push([x, y + CELL, x + CELL, y + CELL]);
  if (open(-1, 0)) SEGS.push([x, y, x + CELL, y]);
  if (open(0, 1))  SEGS.push([x + CELL, y, x + CELL, y + CELL]);
  if (open(0, -1)) SEGS.push([x, y, x, y + CELL]);
}
const DOORS = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
  if (MAZE[r][c] === '-') DOORS.push([c * CELL, r * CELL + CELL / 2, (c + 1) * CELL, r * CELL + CELL / 2]);

// House geometry (door = cols 13-14 row 11, interior = cols 11-16 rows 12-13)
const DOOR_X = 13.75 * CELL;          // 275
const HOUSE_Y = 13.0 * CELL;          // 260
const HOUSE_TOP_Y = 12.0 * CELL;      // 250
const EXIT_Y = 10.0 * CELL;           // 210 (passage row under house)
const PAC_START = { x: 13.5 * CELL, y: 21.5 * CELL };           // 270, 430
const FRUIT_POS = { x: DOOR_X, y: 10.5 * CELL };                // just under the door

function freshPellets() {
  const grid = []; let remaining = 0;
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      const ch = MAZE[r][c];
      if (ch === '.') { grid[r][c] = 1; remaining++; }
      else if (ch === 'o' || ch === '?') { grid[r][c] = 2; remaining++; }
      else grid[r][c] = 0;
    }
  }
  return { grid, remaining };
}
const frightDur = lvl => Math.max(6 - (lvl - 1) * 0.7, 1.5);
const pad = n => String(n).padStart(6, '0');

// ============================================================
class Game {
  constructor() {
    this.audio = null;                 // { waka, power, ... } assigned by boot()
    this.high = this.loadHigh();
    this.reset();
  }
  play(name, arg) { if (this.audio && this.audio[name]) this.audio[name](arg); }
  loadHigh() { try { return +localStorage.getItem('pacman-high') || 0; } catch (e) { return 0; } }
  saveHigh() {
    if (this.score > this.high) this.high = this.score;
    try { localStorage.setItem('pacman-high', String(this.high)); } catch (e) {}
  }

  reset() {
    this.score = 0; this.lives = 3; this.level = 1;
    this.state = 'title';              // title | ready | run | dying | clear | over
    this.stateT = 0; this.t = 0; this.runTime = 0; this.lastMode = null;
    this.freeze = 0; this.fright = 0; this.combo = 0;
    this.pelletsEaten = 0;
    this.pellets = freshPellets();
    this.fruit = null;
    this.popup = null;
    this.paused = false;
    this.buildActors();
    this.state = 'title';
  }
  start() {
    if (this.state !== 'title') return;
    this.state = 'ready'; this.stateT = 0;
    this.play('ready');
  }

  buildActors() {
    this.pac = {
      x: PAC_START.x, y: PAC_START.y,
      dir: { x: -1, y: 0 }, nextDir: { x: -1, y: 0 },
      lastAngle: Math.PI, kind: 'pac'
    };
    const mk = (name, color, x, y, releaseAt, slotX) => ({
      name, color, x, y, slotX,
      dir: { x: 0, y: -1 }, nextDir: { x: 0, y: -1 },
      state: 'house', releaseAt, bob: Math.random() * 6, bobY: 0,
      phases: null, phase: 0, stateT: 0, kind: 'ghost'
    });
    this.ghosts = [
      { name: 'blinky', color: '#ff3b30', x: 13.5 * CELL, y: EXIT_Y, slotX: 13.5 * CELL,
        dir: { x: -1, y: 0 }, nextDir: { x: -1, y: 0 }, state: 'out',
        releaseAt: 0, bob: 0, bobY: 0, phases: null, phase: 0, stateT: 0, kind: 'ghost' },
      mk('pinky',  '#ff9ff5', DOOR_X,        HOUSE_Y, 4,  DOOR_X),
      mk('inky',   '#00e5ff', 12.25 * CELL,  HOUSE_Y, 8,  12.25 * CELL),
      mk('clyde',  '#ffb84d', 15.25 * CELL,  HOUSE_Y, 13, 15.25 * CELL),
    ];
  }
  ready() {
    this.state = 'ready'; this.stateT = 0;
    this.runTime = 0; this.lastMode = null;
    this.fright = 0; this.combo = 0; this.freeze = 0;
    this.fruit = null; this.popup = null;
    this.buildActors();
    this.play('ready');
  }

  // ---------------- grid helpers ----------------
  canWalk(cx, cy, d, throughDoor = false) {
    const tx = cx + d.x, ty = cy + d.y;
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) {
      if ((tx < 0 || tx >= COLS) && isTunnelRow(cy)) return true;   // outside stub
      return false;
    }
    if (!WALL[ty][tx]) return true;
    return throughDoor && !!DOOR[ty][tx];
  }

  // ---------------- movement ----------------
  stepActor(a, dt, speed) {
    if ((a.dir.x === 0 && a.dir.y === 0)) {
      if (a.nextDir) {
        const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL);
        const ccx = (cx + 0.5) * CELL, ccy = (cy + 0.5) * CELL;
        if (Math.abs(a.x - ccx) < 0.5 && Math.abs(a.y - ccy) < 0.5 &&
            this.canWalk(cx, cy, a.nextDir)) a.dir = { ...a.nextDir };
        else return;
      } else return;
    }
    let rem = speed * dt, guard = 0;
    while (rem > 0.0001 && guard++ < 8) {
      const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL);
      const ccx = (cx + 0.5) * CELL, ccy = (cy + 0.5) * CELL;
      const dc = (ccx - a.x) * a.dir.x + (ccy - a.y) * a.dir.y;
      if (dc > 0.0001) {
        const mv = Math.min(rem, dc);
        a.x += a.dir.x * mv; a.y += a.dir.y * mv; rem -= mv;
        if (mv >= dc - 0.0001) {
          a.x = ccx; a.y = ccy; rem = 0;
          this.onCenter(a);
          if (a.dir.x === 0 && a.dir.y === 0) break;   // stopped at a wall
        }
      } else {
        a.x += a.dir.x * rem; a.y += a.dir.y * rem; rem = 0;
      }
    }
    // keep a lastAngle for the mouth renderer
    if (a.dir.x !== 0 || a.dir.y !== 0) {
      a.lastAngle = Math.atan2(a.dir.y, a.dir.x);
    }
  }
  tunnelWrap(a) {
    if (a.x < -CELL / 2) a.x += (COLS + 1) * CELL;
    else if (a.x > W + CELL / 2) a.x -= (COLS + 1) * CELL;
  }
  onCenter(a) {
    const cx = Math.round(a.x / CELL - 0.5), cy = Math.round(a.y / CELL - 0.5);
    if (a.kind === 'pac') {
      if ((a.nextDir.x !== a.dir.x || a.nextDir.y !== a.dir.y) && this.canWalk(cx, cy, a.nextDir))
        a.dir = { ...a.nextDir };
      if (!this.canWalk(cx, cy, a.dir)) a.dir = { x: 0, y: 0 };
      this.eatAt(cx, cy);
      return;
    }
    // ---- ghosts ----
    if (a.state === 'eyes') {
      if (Math.abs(a.x - 13.5 * CELL) < 1 && Math.abs(a.y - EXIT_Y) < 1) {
        this.beginEntering(a);
        return;
      }
      const opts = this.walkOpts(cx, cy, a, true);
      if (opts.length) a.dir = this.pickToward(a, opts, { x: 13, y: 10 });
      return;
    }
    if (a.state !== 'out' && a.state !== 'fright') return;
    const opts = this.walkOpts(cx, cy, a, false);
    if (!opts.length) return;
    if (a.state === 'fright') { a.dir = opts[(Math.random() * opts.length) | 0].d; return; }
    a.dir = this.pickToward(a, opts, this.ghostTarget(a));
  }
  walkOpts(cx, cy, a, throughDoor) {
    const out = [];
    for (const d of DIRS) {
      if (d.x === -a.dir.x && d.y === -a.dir.y) continue;        // no reversing
      if (!this.canWalk(cx, cy, d, throughDoor)) continue;
      let tx = cx + d.x;
      if (tx < 0) tx = COLS - 1; else if (tx >= COLS) tx = 0;
      out.push({ d, x: tx, y: cy + d.y });
    }
    return out;
  }
  pickToward(a, opts, t) {
    let best = null, bd = Infinity;
    for (const o of opts) {
      const d = (o.x - t.x) ** 2 + (o.y - t.y) ** 2;
      if (d < bd) { bd = d; best = o; }
    }
    return best ? best.d : a.dir;
  }
  ghostTarget(a) {
    const p = this.pac;
    const pcx = Math.floor(p.x / CELL), pcy = Math.floor(p.y / CELL);
    if (this.mode === 'scatter') {
      const corners = { blinky: { x: 26, y: 1 }, pinky: { x: 1, y: 1 }, inky: { x: 26, y: 27 }, clyde: { x: 1, y: 27 } };
      return corners[a.name];
    }
    switch (a.name) {
      case 'blinky': return { x: pcx, y: pcy };
      case 'pinky':  return { x: pcx + 4 * p.dir.x, y: pcy + 4 * p.dir.y };
      case 'inky': {
        const b = this.ghosts[0];
        const bx = Math.floor(b.x / CELL), by = Math.floor(b.y / CELL);
        const tx = pcx + 4 * p.dir.x, ty = pcy + 4 * p.dir.y;
        return { x: 2 * tx - bx, y: 2 * ty - by };
      }
      case 'clyde': {
        const dx = pcx - Math.floor(a.x / CELL), dy = pcy - Math.floor(a.y / CELL);
        return (dx * dx + dy * dy) > 64 ? { x: pcx, y: pcy } : { x: 13, y: 21 };
      }
    }
    return { x: pcx, y: pcy };
  }
  ghostSpeed(a) {
    let s = 92 * Math.min(1 + (this.level - 1) * 0.035, 1.35);
    if (a.state === 'fright') s = 55;
    else if (a.state === 'eyes') s = 250;
    const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL);
    if (a.state === 'out' && cy === 13 && (cx < 7 || cx > 20)) s *= 0.75;   // tunnel drag
    return s;
  }
  pacSpeed() { return 100 * Math.min(1 + (this.level - 1) * 0.015, 1.12); }

  // ---------------- scripted house motions ----------------
  beginLeaving(a) {
    a.state = 'leaving'; a.phase = 0; a.stateT = 0;
    a.phases = [
      { x: a.slotX, y: HOUSE_TOP_Y },
      { x: DOOR_X, y: HOUSE_TOP_Y },
      { x: DOOR_X, y: EXIT_Y },
      { x: 13.5 * CELL, y: EXIT_Y },
    ];
  }
  beginEntering(a) {
    a.state = 'entering'; a.phase = 0; a.stateT = 0;
    a.phases = [ { x: DOOR_X, y: EXIT_Y }, { x: DOOR_X, y: HOUSE_Y } ];
    a.dir = { x: 0, y: 1 };
  }
  moveToPhase(a, dt, speed) {
    const ph = a.phases[a.phase];
    if (!ph) return true;
    let rem = speed * dt;
    let dx = ph.x - a.x, dy = ph.y - a.y;
    if (Math.abs(dx) > 0.5) {
      const use = Math.min(rem, Math.abs(dx));
      a.x += Math.sign(dx) * use; rem -= use; dx = ph.x - a.x;
    }
    if (Math.abs(ph.y - a.y) > 0.5 && rem > 0) {
      const use = Math.min(rem, Math.abs(ph.y - a.y));
      a.y += Math.sign(ph.y - a.y) * use; rem -= use;
    }
    if (Math.abs(ph.x - a.x) <= 0.5 && Math.abs(ph.y - a.y) <= 0.5) {
      a.x = ph.x; a.y = ph.y; a.phase++;
      if (a.phase >= a.phases.length) return true;
    }
    return false;
  }
  finishLeaving(a) {
    a.state = this.fright > 0 ? 'fright' : 'out';
    a.dir = { x: -1, y: 0 }; a.nextDir = a.dir;
  }

  // ---------------- main update ----------------
  update(dt) {
    if (this.paused) return;
    this.t += dt; this.stateT += dt;

    if (this.state === 'title' || this.state === 'over') return;

    if (this.state === 'ready') {
      if (this.stateT > 1.2) { this.state = 'run'; this.stateT = 0; this.lastMode = null; }
      return;
    }
    if (this.state === 'dying') {
      if (this.stateT > 1.4) {
        this.lives--;
        if (this.lives > 0) this.ready();
        else { this.state = 'over'; this.saveHigh(); }
      }
      return;
    }
    if (this.state === 'clear') {
      if (this.stateT > 2.4) {
        this.level++;
        this.pellets = freshPellets();
        this.ready();
      }
      return;
    }

    // ----- state === 'run' -----
    this.runTime += dt;

    const m = this.mode;
    if (this.lastMode !== null && m !== this.lastMode) {
      for (const a of this.ghosts)
        if (a.state === 'out' || a.state === 'fright') a.dir = { x: -a.dir.x, y: -a.dir.y };
    }
    this.lastMode = m;

    if (this.freeze > 0) {
      this.freeze -= dt;
      if (this.popup) this.popup.t += dt;
      return;
    }
    if (this.fright > 0) {
      this.fright -= dt;
      if (this.fright <= 0)
        for (const a of this.ghosts) if (a.state === 'fright') a.state = 'out';
    }

    this.updatePac(dt);
    for (const a of this.ghosts) this.updateGhost(a, dt);
    this.collide();

    if (this.fruit) {
      this.fruit.t -= dt;
      if (this.fruit.t <= 0) this.fruit = null;
      else {
        const dx = this.pac.x - this.fruit.x, dy = this.pac.y - this.fruit.y;
        if (dx * dx + dy * dy < 16 * 16) {
          this.addScore(this.fruit.pts);
          this.play('fruit');
          this.fruit = null;
        }
      }
    }
  }

  get mode() {
    const sched = [['scatter', 7], ['chase', 20], ['scatter', 7], ['chase', 20], ['scatter', 5], ['chase', 1e9]];
    let t = 0;
    for (const [m, d] of sched) { if (this.runTime < t + d) return m; t += d; }
    return 'chase';
  }

  updatePac(dt) {
    this.stepActor(this.pac, dt, this.pacSpeed());
    this.tunnelWrap(this.pac);
  }
  updateGhost(a, dt) {
    switch (a.state) {
      case 'house':
        a.bobY = Math.sin(this.t * 3 + a.bob) * 3;
        if (this.runTime >= a.releaseAt) this.beginLeaving(a);
        break;
      case 'leaving':
        if (this.moveToPhase(a, dt, 60)) this.finishLeaving(a);
        break;
      case 'entering':
        if (this.moveToPhase(a, dt, 200)) { a.state = 'revive'; a.stateT = 0; }
        break;
      case 'revive':
        a.stateT += dt;
        if (a.stateT > 0.8) this.beginLeaving(a);
        break;
      case 'out': case 'fright':
        this.stepActor(a, dt, this.ghostSpeed(a));
        this.tunnelWrap(a);
        break;
      case 'eyes':
        this.stepActor(a, dt, 250);
        this.tunnelWrap(a);
        break;
    }
  }

  eatAt(cx, cy) {
    const v = this.pellets.grid[cy][cx];
    if (!v) return;
    this.pellets.grid[cy][cx] = 0;
    this.pellets.remaining--;
    this.pelletsEaten++;
    this.addScore(v === 2 ? 100 : 10);
    if (v === 2) {
      this.fright = frightDur(this.level);
      this.combo = 0;
      for (const a of this.ghosts)
        if (a.state === 'out') { a.state = 'fright'; a.dir = { x: -a.dir.x, y: -a.dir.y }; }
      this.play('power');
    } else {
      this.wakaFlip = (this.wakaFlip || 0) ^ 1;
      this.play('waka', this.wakaFlip);
    }
    if ((this.pelletsEaten === 70 || this.pelletsEaten === 170) && !this.fruit) {
      const pts = [100, 300, 500, 700, 1000, 2000][Math.min(this.level - 1, 5)];
      this.fruit = { x: FRUIT_POS.x, y: FRUIT_POS.y, t: 10, pts };
    }
    if (this.pellets.remaining === 0) {
      this.state = 'clear'; this.stateT = 0;
      this.play('clear');
    }
  }
  addScore(n) {
    this.score += n;
    if (this.score > this.high) this.high = this.score;
  }
  collide() {
    const p = this.pac;
    for (const a of this.ghosts) {
      if (a.state !== 'out' && a.state !== 'fright') continue;
      const dx = a.x - p.x, dy = a.y - p.y;
      if (dx * dx + dy * dy > 10.5 * 10.5) continue;
      if (a.state === 'fright') {
        const pts = 200 * (1 << Math.min(this.combo, 3));
        this.combo = Math.min(this.combo + 1, 3);
        this.addScore(pts);
        a.state = 'eyes';
        a.dir = { x: -a.dir.x, y: -a.dir.y };
        a.nextDir = a.dir;
        this.freeze = 0.5;
        this.popup = { x: a.x, y: a.y, text: String(pts), t: 0 };
        this.play('ghostEat');
      } else {
        this.state = 'dying'; this.stateT = 0;
        this.play('death');
        return;
      }
    }
  }

  // ============================================================
  //  RENDER
  // ============================================================
  render(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, CH);

    // ---- HUD ----
    ctx.font = '15px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + pad(this.score), 16, 24);
    ctx.textAlign = 'center';
    ctx.fillText('TOP ' + pad(this.high), W / 2, 24);
    ctx.textAlign = 'right';
    ctx.fillText('LEVEL ' + this.level, W - 16, 24);
    const livesShown = Math.max(0, this.lives - (this.state === 'dying' ? 1 : 0));
    for (let i = 0; i < livesShown; i++) this.drawPacIcon(ctx, 22 + i * 20, 48, 7);
    ctx.textAlign = 'right';
    ctx.fillText(this.audioMuted ? '\u{1F507}' : '\u{1F50A}', W - 16, 52);

    // ---- walls ----
    const blink = this.state === 'clear' && Math.floor(this.stateT * 4) % 2 === 0;
    ctx.strokeStyle = blink ? '#ffe14a' : '#2b4bff';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of SEGS) { ctx.moveTo(x1, y1 + OY); ctx.lineTo(x2, y2 + OY); }
    ctx.stroke();
    ctx.strokeStyle = '#ffa0b4';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (const [x1, y1, x2, y2] of DOORS) { ctx.moveTo(x1, y1 + OY); ctx.lineTo(x2, y2 + OY); }
    ctx.stroke();

    // ---- pellets ----
    const g = this.pellets.grid;
    ctx.fillStyle = '#ffc9a3';
    ctx.beginPath();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (g[r][c] === 1) {
        ctx.moveTo((c + 0.5) * CELL + 2.4, (r + 0.5) * CELL + OY);
        ctx.arc((c + 0.5) * CELL, (r + 0.5) * CELL + OY, 2.4, 0, Math.PI * 2);
      }
    ctx.fill();
    const pr = 6.5 + 1.5 * Math.sin(this.t * 6);
    ctx.beginPath();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (g[r][c] === 2) {
        const x = (c + 0.5) * CELL, y = (r + 0.5) * CELL + OY;
        ctx.moveTo(x + pr, y);
        ctx.arc(x, y, pr, 0, Math.PI * 2);
      }
    ctx.fill();

    // ---- fruit ----
    if (this.fruit) this.drawFruit(ctx, this.fruit.x, this.fruit.y + OY);

    // ---- ghosts ----
    for (const a of this.ghosts) this.drawGhost(ctx, a);

    // ---- pac ----
    if (this.state !== 'over') this.drawPacSprite(ctx, this.pac);

    // ---- score popup ----
    if (this.popup && this.freeze > 0) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px ui-monospace, monospace';
      ctx.fillText(this.popup.text, this.popup.x, this.popup.y + OY - 14);
    }

    // ---- status text ----
    ctx.textAlign = 'center';
    if (this.state === 'ready') {
      ctx.fillStyle = '#ffe14a';
      ctx.font = 'bold 18px ui-monospace, monospace';
      ctx.fillText('READY!', W / 2, OY + 4 * CELL + 12);
    }
    if (this.state === 'dying' && this.stateT < 0.2) {
      ctx.fillStyle = '#ffe14a';
      ctx.font = 'bold 18px ui-monospace, monospace';
      ctx.fillText('READY!', W / 2, OY + 4 * CELL + 12);
    }
    if (this.paused && this.state === 'run') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, OY, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px ui-monospace, monospace';
      ctx.fillText('PAUSED', W / 2, OY + H / 2);
    }
    if (this.state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(0, OY, W, H);
      ctx.fillStyle = '#ff3b30';
      ctx.font = 'bold 34px ui-monospace, monospace';
      ctx.fillText('GAME OVER', W / 2, OY + H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '16px ui-monospace, monospace';
      ctx.fillText('SCORE ' + pad(this.score) + (this.score >= this.high && this.score > 0 ? '  \u2605 NEW BEST' : ''), W / 2, OY + H / 2 + 14);
      ctx.fillStyle = '#888';
      ctx.font = '14px ui-monospace, monospace';
      ctx.fillText('press ENTER or tap to play again', W / 2, OY + H / 2 + 44);
    }
    if (this.state === 'title') {
      ctx.fillStyle = 'rgba(0,0,0,0.78)';
      ctx.fillRect(0, OY, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffe14a';
      ctx.font = 'bold 44px ui-monospace, monospace';
      ctx.fillText('PAC-MAN', W / 2, OY + 190);
      const cols = ['#ff3b30', '#ff9ff5', '#00e5ff', '#ffb84d'];
      cols.forEach((c, i) => this.drawGhostFace(ctx, W / 2 - 90 + i * 60, OY + 250, c, { x: 0, y: 0 }));
      this.drawPacIcon(ctx, W / 2, OY + 250, 9);
      const blinkOn = Math.floor(this.t * 2) % 2 === 0;
      if (blinkOn) {
        ctx.fillStyle = '#fff';
        ctx.font = '17px ui-monospace, monospace';
        ctx.fillText('press any key or tap to start', W / 2, OY + 330);
      }
      ctx.fillStyle = '#888';
      ctx.font = '13px ui-monospace, monospace';
      ctx.fillText('arrows/WASD \u00b7 P pause \u00b7 M sound \u00b7 swipe on mobile', W / 2, OY + 360);
      ctx.fillText('eat the dots \u00b7 grab the big ones \u00b7 do not be eaten', W / 2, OY + 382);
    }
  }

  drawPacIcon(ctx, x, y, r) {
    const open = Math.PI * 0.3;
    const ang = Math.PI;   // facing left
    ctx.fillStyle = '#ffe14a';
    ctx.beginPath();
    ctx.arc(x, y, r, ang + open, ang - open + Math.PI * 2);
    ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fill();
  }
  drawPacSprite(ctx, p) {
    const x = p.x, y = p.y + OY;
    let ang = p.lastAngle, open = Math.PI * 0.18;
    if (this.state === 'dying') {
      const k = Math.min(1, this.stateT / 1.1);
      ang = this.t * 10;
      open = Math.min(Math.PI * 0.98, 0.25 + k * Math.PI);
      if (k > 0.85) {
        // shrink out
        const r = 9 * (1 - (k - 0.85) / 0.15);
        if (r <= 0.5) return;
        ctx.fillStyle = '#ffe14a';
        ctx.beginPath();
        ctx.arc(x, y, r, ang + open, ang - open + Math.PI * 2);
        ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
        return;
      }
    } else if (p.dir.x !== 0 || p.dir.y !== 0) {
      open = (0.22 + 0.5 * Math.abs(Math.sin(this.t * 10))) * Math.PI * 0.5;
    }
    ctx.fillStyle = '#ffe14a';
    ctx.beginPath();
    ctx.arc(x, y, 9, ang + open, ang - open + Math.PI * 2);
    ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fill();
  }
  drawGhost(ctx, a) {
    const x = a.x, y = a.y + OY + (a.state === 'house' ? a.bobY : 0);
    const eyesOnly = a.state === 'eyes' || a.state === 'entering';
    let bodyColor = a.color, face = 'normal';
    if (a.state === 'fright') {
      const flashing = this.fright < 2 && Math.floor(this.t * 8) % 2 === 0;
      bodyColor = flashing ? '#f5f5f5' : '#2121ff';
      face = 'fright';
    }
    const r = 9, top = y - 1, phase = Math.floor(this.t * 6 + a.bob) % 2;
    if (!eyesOnly) {
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.arc(x, top, r, Math.PI, 0);
      ctx.lineTo(x + r, y + r - 1);
      const n = 3, w = (2 * r) / n;
      for (let i = 0; i < n; i++) {
        const xr = x + r - i * w;
        ctx.lineTo(xr - w / 2, y + r - 5 + (phase ? 3 : 0));
        ctx.lineTo(xr - w, y + r - 1);
      }
      ctx.closePath();
      ctx.fill();
    }
    const lx = a.dir.x * 2.2, ly = a.dir.y * 2.2;
    if (face === 'fright') {
      ctx.fillStyle = eyesOnly ? '#fff' : '#ffe8e8';
      for (const s of [-3.5, 3.5]) {
        ctx.beginPath(); ctx.arc(x + s, y - 2, 1.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#ffd0d0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - 6, y + 4);
      for (let i = 0; i < 4; i++)
        ctx.lineTo(x - 6 + (i + 0.5) * 3, y + 3 + (i % 2 ? 1.5 : -1.5));
      ctx.lineTo(x + 6, y + 4);
      ctx.stroke();
    } else {
      for (const s of [-3.5, 3.5]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(x + s, y - 3 + ly, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2222ff';
        ctx.beginPath(); ctx.ellipse(x + s + lx, y - 3 + ly * 1.6, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  drawGhostFace(ctx, x, y, color, dir) {
    const r = 9, top = y - 1, phase = 0;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, top, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r - 1);
    const n = 3, w = (2 * r) / n;
    for (let i = 0; i < n; i++) {
      const xr = x + r - i * w;
      ctx.lineTo(xr - w / 2, y + r - 5 + (phase ? 3 : 0));
      ctx.lineTo(xr - w, y + r - 1);
    }
    ctx.closePath(); ctx.fill();
    for (const s of [-3.5, 3.5]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x + s, y - 3, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2222ff';
      ctx.beginPath(); ctx.ellipse(x + s + 1, y - 2.5, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  drawFruit(ctx, x, y) {
    ctx.fillStyle = '#ff2a2a';
    ctx.beginPath(); ctx.arc(x - 3.5, y + 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3.5, y + 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3fae4a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 3, y - 1); ctx.quadraticCurveTo(x - 1, y - 7, x + 2, y - 8);
    ctx.moveTo(x + 3, y - 1); ctx.quadraticCurveTo(x + 1, y - 7, x + 2, y - 8);
    ctx.stroke();
  }
}

// ============================================================
//  BOOT (browser only)
// ============================================================
function boot() {
  const canvas = document.getElementById('game');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = CH * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = CH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const game = new Game();
  if (typeof window !== 'undefined') window.__pacmanGame = game;

  // ---------- audio ----------
  let ac = null;
  let muted = false;
  try { muted = localStorage.getItem('pacman-muted') === '1'; } catch (e) {}
  game.audioMuted = muted;
  const tone = (f0, f1, dur, type, vol, when = 0) => {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t0 = ac.currentTime + when;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(Math.max(f0, 1), t0);
      if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    } catch (e) {}
  };
  const SFX = {
    waka: f => tone(f ? 560 : 340, f ? 340 : 560, 0.08, 'square', 0.05),
    power: () => tone(180, 720, 0.35, 'sawtooth', 0.07),
    ghostEat: () => tone(280, 1200, 0.16, 'square', 0.08),
    death: () => { tone(560, 90, 1.1, 'sawtooth', 0.09); tone(300, 55, 1.1, 'square', 0.04); },
    fruit: () => { tone(660, 0, 0.07, 'square', 0.07); tone(880, 0, 0.1, 'square', 0.07, 0.09); },
    ready: () => { tone(440, 0, 0.09, 'square', 0.06); tone(550, 0, 0.09, 'square', 0.06, 0.11); tone(660, 0, 0.14, 'square', 0.06, 0.22); },
    clear: () => { tone(392, 0, 0.1, 'square', 0.07); tone(523, 0, 0.1, 'square', 0.07, 0.12); tone(659, 0, 0.1, 'square', 0.07, 0.24); tone(784, 0, 0.2, 'square', 0.07, 0.36); },
  };
  game.audio = SFX;

  // ---------- input ----------
  const DIRMAP = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM') {
      muted = !muted;
      game.audioMuted = muted;
      try { localStorage.setItem('pacman-muted', muted ? '1' : '0'); } catch (err) {}
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (game.state === 'run' || game.state === 'ready') game.paused = !game.paused;
      return;
    }
    if (game.state === 'title') { game.start(); return; }
    if (game.state === 'over' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR')) {
      game.reset(); game.start(); return;
    }
    const d = DIRMAP[e.code];
    if (d) { game.pac.nextDir = { x: d[0], y: d[1] }; e.preventDefault(); }
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  });

  let tS = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    tS = { x: t.clientX, y: t.clientY, t: Date.now() };
    if (game.state === 'title') game.start();
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (!tS) return;
    const t = e.touches[0];
    const dx = t.clientX - tS.x, dy = t.clientY - tS.y;
    if (Math.hypot(dx, dy) > 22) {
      game.pac.nextDir = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };
      tS = { x: t.clientX, y: t.clientY, t: Date.now() };
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    if (tS && Date.now() - tS.t < 250) {
      if (game.state === 'title') game.start();
      else if (game.state === 'over') { game.reset(); game.start(); }
    }
    tS = null;
  }, { passive: true });
  canvas.addEventListener('click', () => {
    if (game.state === 'title') game.start();
    else if (game.state === 'over') { game.reset(); game.start(); }
  });

  window.addEventListener('blur', () => {
    if (game.state === 'run' || game.state === 'ready') game.paused = true;
  });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.update(dt);
    game.render(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

if (typeof document !== 'undefined') boot();
else if (typeof module !== 'undefined') module.exports = { Game, MAZE, COLS, ROWS, CELL, W, CH };
</script>
</body>
</html>
